name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
    # 只改了官网或文档时不需要重新打包
    paths-ignore: ['site/**', '.github/workflows/pages.yml', '**/*.md']
  pull_request:
    paths-ignore: ['site/**', '.github/workflows/pages.yml', '**/*.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 两种 macOS 运行器都会构建 arm64 + x64 安装包；任一成功即可下载
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build macOS app (arm64 + x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac -- --publish never

      - name: Verify app bundles
        run: |
          for app in dist/mac*/SSHub.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"
          done
          ls -lh dist/*.dmg dist/*.zip

      - name: Smoke test (launch app for this machine's arch)
        run: |
          if [ "$(uname -m)" = "arm64" ]; then APP=dist/mac-arm64/SSHub.app; else APP=dist/mac/SSHub.app; fi
          "$APP/Contents/MacOS/SSHub" > launch.log 2>&1 &
          PID=$!
          sleep 15
          if kill -0 $PID 2>/dev/null; then
            echo "App is running"; kill $PID
          else
            echo "App exited early"; cat launch.log; exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SSHub-macOS-built-on-${{ matrix.runner }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build Windows app (x64 + arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem dist -File | Format-Table Name, Length

      - name: Smoke test (launch x64 app)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\win-unpacked\SSHub.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "App exited early (code $($p.ExitCode))"; exit 1 }
          Write-Host "App is running"
          Get-Process -Name SSHub -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SSHub-Windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    # 打 v* 标签时发布 Release：macOS 取任一构建成功的运行器产出的安装包，再加上 Windows 安装包
    needs: [build, build-windows]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SSHub-*
          path: artifacts

      - name: Collect installers
        run: |
          mkdir -p release
          mac=$(ls -d artifacts/SSHub-macOS-built-on-*/ 2>/dev/null | head -n 1)
          if [ -n "$mac" ]; then echo "macOS from $mac"; cp "$mac"*.dmg "$mac"*.zip release/; else echo "::warning::没有 macOS 安装包"; fi
          if [ -d artifacts/SSHub-Windows ]; then cp artifacts/SSHub-Windows/* release/; else echo "::warning::没有 Windows 安装包"; fi
          if [ -z "$(ls release)" ]; then echo "没有任何成功的构建产物"; exit 1; fi
          ls -lh release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
